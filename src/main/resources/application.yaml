spring:
  application:
    name: ecommerce
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ecommerce-pool
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  data:
    redis:
      timeout: 2s
      connect-timeout: 2s

  mail:
    default-encoding: UTF-8
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    issuer: ecommerce
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  storage:
    region: us-east-1
    presign-ttl: 15m